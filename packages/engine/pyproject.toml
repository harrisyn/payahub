[project]
name = "payahub-engine"
version = "0.1.0"
description = "Claim state machine, submission strategy selection and the deterministic submission pipeline."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "payahub-claim-model", "payahub-connectors"]

[tool.uv.sources]
payahub-claim-model = { workspace = true }
payahub-connectors = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payahub_engine"]
