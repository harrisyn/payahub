[project]
name = "payahub-claim-model"
version = "0.1.0"
description = "Canonical claim model shared by every Payahub channel and connector."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payahub_claim_model"]
