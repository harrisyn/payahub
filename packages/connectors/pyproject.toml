[project]
name = "payahub-connectors"
version = "0.1.0"
description = "Connector SDK and per-payer connectors."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "httpx>=0.27", "payahub-claim-model"]

[tool.uv.sources]
payahub-claim-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payahub_connectors"]
