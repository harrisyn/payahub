openapi: 3.1.0
info:
  title: Payahub API
  version: 0.1.0
  description: |
    Send any claim, in any form, to any supported payer.
    Payers and standard items are one shared catalogue; organisations map their own item codes to it once.
    Authenticate with `Authorization: Bearer <api key>`. Sandbox keys reach a simulated payer.
    Money is in minor units (pesewas, cents). Every write accepts an `Idempotency-Key`.

    Console endpoints (account, organisation, keys, insurer credentials) take a session token
    (`ses_…`, from `POST /v1/signup` or `POST /v1/sessions`) in the same header. An API key
    gets `403 session_required` there, so a leaked key cannot mint keys or read settings.
servers:
  - url: http://localhost:8080
security:
  - apiKey: []
paths:
  /v1/health:
    get:
      security: []
      summary: Liveness and database reachability
      responses:
        "200": { description: OK }
        "503": { description: Database unreachable }
  /v1/payers:
    get:
      security: []
      summary: The shared payer catalogue. Each payer is standalone or reached through a platform.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Payer" } }
  /v1/payers/{id}:
    get:
      security: []
      summary: One payer from the catalogue
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Payer" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/connectors:
    get:
      security: []
      summary: Platforms and payer interfaces, with the account fields an organisation enters for each
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Connector" } } } }
  /v1/items:
    get:
      security: []
      summary: The standard list of billable items. With q, the closest matches first.
      parameters:
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/ItemKind" } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Item" } } } }
  /v1/items/{id}:
    get:
      security: []
      summary: One standard item and each payer's code for it
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Item" }
                  payer_codes:
                    type: array
                    items:
                      type: object
                      properties: { payer_id: { type: string }, code: { type: string }, description: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/items/suggest:
    post:
      summary: Suggest standard items for the organisation's own items. Nothing is saved.
      description: |
        When a model is set up for code matching, it picks first (source "model", with its reason and
        evidence: model, prompt version and hash); the catalogue's word matching fills the remaining
        places. A model can only pick an item that is in the catalogue, of the kind given. When no model
        is set up, or every model fails, the suggestions are word matches only and method says so.
      parameters:
        - { name: method, in: query, schema: { type: string, enum: [auto, words], default: auto }, description: "words skips the model" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    properties: { code: { type: string }, name: { type: string }, kind: { $ref: "#/components/schemas/ItemKind" } }
      responses:
        "200":
          description: Up to three suggestions per item, best first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        name: { type: string }
                        suggestions:
                          type: array
                          items:
                            type: object
                            properties:
                              item: { $ref: "#/components/schemas/Item" }
                              confidence: { type: number, minimum: 0, maximum: 1 }
                              source: { type: string, enum: [words, model] }
                              reason: { type: string, description: What the model read the item as }
                              evidence: { $ref: "#/components/schemas/Evidence" }
                  method: { type: string, enum: [words, model] }
                  note: { type: string, description: Set when the model could not answer }
  /v1/item-mappings:
    get:
      summary: The organisation's own codes mapped to standard items
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/ItemMapping" } } } }
    put:
      summary: Save confirmed mappings, all or none. Repeating the request gives the same result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mappings]
              properties:
                mappings:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [local_code, item_id]
                    properties: { local_code: { type: string }, local_name: { type: string }, item_id: { type: string } }
      responses:
        "200":
          description: Saved; the full list
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/ItemMapping" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/item-mappings/{code}:
    delete:
      summary: Remove one mapping
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /v1/signup:
    post:
      security: []
      summary: "Start a free trial: creates the organisation, its first user, a session and a sandbox key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, organization]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                name: { type: string }
                organization: { type: string }
                country: { type: string, description: Two-letter code, default GH }
      responses:
        "201":
          description: Created. The sandbox key is shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization_id: { type: string }
                  user_id: { type: string }
                  session_token: { type: string }
                  sandbox_key: { type: string }
                  trial_ends_at: { type: string, format: date-time }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/sessions:
    post:
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema: { type: object, properties: { session_token: { type: string } } }
        "401": { $ref: "#/components/responses/Error" }
  /v1/sessions/current:
    delete:
      security: [{ session: [] }]
      summary: Sign out
      responses:
        "204": { description: Signed out }
  /v1/organization:
    get:
      security: [{ session: [] }]
      summary: The organisation, this month's usage, the recommended method and the onboarding steps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization: { $ref: "#/components/schemas/Organization" }
                  usage: { $ref: "#/components/schemas/Usage" }
                  recommendation: { $ref: "#/components/schemas/Recommendation" }
                  operator: { type: boolean, description: Whether the user runs Payahub and may edit the shared catalogue }
                  onboarding:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { enum: [account, profile, payers, items, first_claim, go_live] }
                        done: { type: boolean }
  /v1/organization/profile:
    put:
      security: [{ session: [] }]
      summary: Say how the organisation bills today; answers with the recommended way to connect
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/Profile" } }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/Profile" }
                  recommendation: { $ref: "#/components/schemas/Recommendation" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/organization/plan:
    put:
      security: [{ session: [] }]
      summary: Choose a plan. Enterprise is recorded as a request and agreed offline.
      description: |
        A plan with a monthly fee charges this month's fee from the wallet at once, less any fee already
        charged this month; `charged` says how much. The fee may take the wallet below zero, which pauses
        live claims until it is funded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { enum: [flat, flat_volume, volume, enterprise] }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { type: object, properties: { plan: { $ref: "#/components/schemas/Plan" }, charged: { type: integer } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/api-keys:
    get:
      security: [{ session: [] }]
      summary: List API keys (prefixes only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/APIKey" } } } }
    post:
      security: [{ session: [] }]
      summary: Create an API key. The full key is in this response only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment]
              properties:
                environment: { enum: [sandbox, live] }
                name: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/APIKey" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/api-keys/{id}:
    delete:
      security: [{ session: [] }]
      summary: Revoke an API key
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /v1/payer-settings:
    get:
      security: [{ session: [] }]
      summary: The payers the organisation uses, per environment
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/PayerSetting" } } } }
  /v1/payer-settings/{payer}/{env}:
    put:
      security: [{ session: [] }]
      summary: Turn a catalogue payer on or off, and say whether the organisation has an account on its platform
      parameters:
        - { name: payer, in: path, required: true, schema: { type: string } }
        - { name: env, in: path, required: true, schema: { enum: [sandbox, live] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                account: { enum: [have, need], description: Omit to keep the earlier answer }
      responses:
        "200":
          description: Saved; the full list
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/PayerSetting" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/connector-accounts:
    get:
      security: [{ session: [] }]
      summary: The organisation's accounts on platforms and payer interfaces. Credential values are never returned.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/ConnectorAccount" } } } }
  /v1/connector-accounts/{connector}/{env}:
    put:
      security: [{ session: [] }]
      summary: Save the organisation's account on a platform (sealed with AES-256-GCM). It serves every payer the platform carries.
      parameters:
        - { name: connector, in: path, required: true, schema: { type: string } }
        - { name: env, in: path, required: true, schema: { enum: [sandbox, live] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credentials:
                  type: object
                  additionalProperties: { type: string }
                  description: Every required field of the connector's credentials
      responses:
        "200":
          description: Saved; the full list
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/ConnectorAccount" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/connector-accounts/{connector}/{env}/check:
    post:
      security: [{ session: [] }]
      summary: Try the saved account with a test member check against one of the payers it reaches, and record the result
      parameters:
        - { name: connector, in: path, required: true, schema: { type: string } }
        - { name: env, in: path, required: true, schema: { enum: [sandbox, live] } }
      responses:
        "200":
          description: Checked
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, message: { type: string } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/claims:
    get:
      summary: List claims, newest first. An API key sees only its own environment.
      parameters:
        - { name: environment, in: query, schema: { enum: [sandbox, live] }, description: Session only }
        - { name: state, in: query, schema: { type: string } }
        - { name: before, in: query, schema: { type: string, format: date-time }, description: The next_before of the previous page }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ClaimSummary" } }
                  next_before: { type: string, format: date-time }
    post:
      summary: Create a claim, and optionally send it and wait for the payer
      description: |
        Without `submit`, the claim is validated and saved, not sent. With `submit=true` it is
        also sent in the same call. Add `Prefer: wait=N` (or `?wait=N`, up to 60 seconds) to get
        the payer's answer in this response: 200 with `outcome` once the payer answers, or 202
        with a `Location` to poll (or a webhook) if it has not answered within N seconds.
        A claim that cannot be sent yet is still saved: 201 with `submitted: false` and the error.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: submit, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Wait" }
        - { $ref: "#/components/parameters/Prefer" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ClaimInput" } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } } }
        "200":
          description: Replay of an earlier request with the same Idempotency-Key, or the payer's answer when waiting
          content: { application/json: { schema: { $ref: "#/components/schemas/Settled" } } }
        "202": { $ref: "#/components/responses/StillWaiting" }
        "402": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/claims/extract:
    post:
      summary: Read a claim form (a PDF or a photo) into a proposed claim. Nothing is saved.
      description: |
        A model reads the form; Payahub then checks every value. Dates and amounts must parse, ICD-10
        codes must be in the list (a missing code is suggested from the diagnosis words and marked for
        review), the insurer must match one catalogue payer, and each line's standard item comes from
        the catalogue's own matching, never from the model. Each field reports its confidence, the words
        it was read from, and needs_review when it is below the threshold for read fields (0.90).
        Check the marked fields, then create the claim with POST /v1/claims. Every model call is
        recorded with its model and prompt version; the document is not stored.

        The model never sees who the patient is. The form is read on Payahub's server first, and the
        patient's name, member, policy and card numbers, date of birth, phone and address are blacked
        out; the model gets only those blacked-out pages, as images. The hidden details are read on the
        server and returned marked needs_review. A form on which the patient's name label cannot be
        found is not sent to the model (422 cannot_deidentify).
      parameters:
        - { name: include, in: query, schema: { enum: [redacted_pages] }, description: Also return the pages as the model saw them }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary } }, required: [file] }
          application/pdf: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: The proposed claim
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim: { $ref: "#/components/schemas/ClaimInput" }
                  fields:
                    type: object
                    description: "By path: member.member_number, diagnoses.0.code, lines.2.unit_price"
                    additionalProperties:
                      type: object
                      properties:
                        confidence: { type: number }
                        quote: { type: string }
                        read: { type: string, description: The model's value when it was dropped or replaced }
                        note: { type: string }
                        needs_review: { type: boolean }
                  payer_name: { type: string, description: The insurer as written }
                  review: { type: integer, description: How many fields need a person }
                  evidence: { $ref: "#/components/schemas/Evidence" }
                  privacy:
                    type: object
                    description: What was blacked out before the model saw the form (kinds and counts, never values)
                    properties:
                      method: { type: string }
                      removed: { type: object, additionalProperties: { type: integer } }
                      pages: { type: integer }
                  redacted_pages: { type: array, items: { type: string, description: A data:image/png URL } }
        "422": { description: The patient's identity could not be found on the form, so it was not read, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: Form reading is not available on this server, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: No model is set up to read documents, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { $ref: "#/components/responses/Error" }
        "415": { description: Not a PDF, PNG, JPEG or WebP file, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: The model could not read the document, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/claims/import:
    post:
      security: [{ apiKey: [] }, { session: [] }]
      summary: Import claims from a CSV or Excel file of claim lines
      description: |
        One row per claim line; rows with the same claim reference make one claim. The header row needs
        a claim reference, payer (id or name), member number and visit date, and an item code or a
        description on each line; patient name, visit type, provider, diagnosis (`;`-separated, primary
        first), authorisation, quantity, unit price and currency are read when present. A line with no
        price takes it from the price list. Each claim is validated exactly as `POST /v1/claims`.
        With `dry_run` nothing is saved. Otherwise each readable claim is saved under an idempotency key
        derived from the file and the claim's rows, so uploading the same file again creates nothing
        new; with `submit`, claims that pass their checks are also queued for sending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: byte, description: The .csv or .xlsx file, base64 }
                dry_run: { type: boolean }
                submit: { type: boolean }
      responses:
        "200":
          description: Every claim in the file, with what happened to it
          content:
            application/json:
              schema:
                type: object
                properties:
                  dry_run: { type: boolean }
                  ready: { type: integer, description: Claims that pass every check }
                  claims:
                    type: array
                    items:
                      type: object
                      properties:
                        reference: { type: string }
                        rows: { type: array, items: { type: integer } }
                        payer_id: { type: string }
                        member_number: { type: string }
                        lines: { type: integer }
                        total: { type: integer, description: Minor units }
                        currency: { type: string }
                        errors: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }
                        issues: { $ref: "#/components/schemas/Validation/properties/issues" }
                        state: { type: string }
                        claim_id: { type: string }
                        replayed: { type: boolean }
                        queued: { type: boolean }
        "422": { $ref: "#/components/responses/Error" }
  /v1/claims/validate:
    post:
      summary: Dry run of the edit rules and submission plan; nothing is stored or sent
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ClaimInput" } }
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/Validation" } }
  /v1/claims/{id}:
    get:
      summary: Get a claim
      parameters: [{ $ref: "#/components/parameters/ClaimID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/claims/{id}/events:
    get:
      summary: The claim's audit timeline, oldest first
      parameters: [{ $ref: "#/components/parameters/ClaimID" }]
      responses:
        "200": { description: OK }
  /v1/claims/{id}/submit:
    post:
      summary: Queue the claim for delivery to its payer
      description: |
        Validates the claim and queues it durably in the same transaction, then answers 202.
        The claim moves to `submitted`, then `acknowledged`, `rejected`, or back to `ready`
        if something a person must fix stopped it. Calling it again while queued is a no-op.
        With `Prefer: wait=N` (or `?wait=N`, up to 60) the call holds until the payer answers
        and returns 200 with `outcome`; if N seconds pass first it returns 202 as usual.
      parameters:
        - { $ref: "#/components/parameters/ClaimID" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Wait" }
        - { $ref: "#/components/parameters/Prefer" }
      responses:
        "200":
          description: The payer answered within the wait
          content: { application/json: { schema: { $ref: "#/components/schemas/Settled" } } }
        "202": { $ref: "#/components/responses/StillWaiting" }
        "402": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/claims/{id}/checks:
    get:
      summary: Run the edit rules on a saved claim without changing it
      description: |
        What stands between the claim and its payer: errors to fix, issues awaiting a person's
        review (an AI value below its threshold, a possible duplicate, a late filing), and warnings.
      parameters: [{ $ref: "#/components/parameters/ClaimID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Validation" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/claims/{id}/review:
    post:
      summary: Confirm issues awaiting review
      description: |
        Records who confirmed each issue, when, and why. Only review-severity issues can be
        confirmed; errors are fixed on the claim. A confirmed issue no longer stops the claim.
      parameters: [{ $ref: "#/components/parameters/ClaimID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [code, field]
                    properties: { code: { type: string }, field: { type: string } }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim: { $ref: "#/components/schemas/Claim" }
                  validation: { $ref: "#/components/schemas/Validation" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/members:
    get:
      summary: List the organisation's members and open invitations (console session)
      description: |
        Every member reads everything in the organisation. Writes from a console session need the
        member's role to allow them, or the answer is 403 not_permitted: claims (claims, claim forms),
        setup (profile, insurer settings and accounts, price list, mappings), billing (plan, wallet,
        payouts, withdrawals), developers (API keys, webhooks) and team (members, invitations).
        Owners and admins hold all five; only an owner adds, changes or removes an owner. Claims staff
        hold claims; finance holds billing; developers hold developers and setup; viewers hold none.
        API keys are not members and act for the whole organisation in their environment.
      responses:
        "200":
          description: Members, invitations and the roles that exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Member" } }
                  invitations: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
                  roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
  /v1/members/{id}:
    put:
      summary: Change a member's role (team)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], properties: { role: { $ref: "#/components/schemas/Role" } } }
      responses:
        "204": { description: Changed. It takes effect on the member's next request. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "last_owner: the organisation keeps at least one owner" }
    delete:
      summary: Remove a member (team); their sessions end at once
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "last_owner" }
  /v1/invitations:
    post:
      summary: Invite someone by email (team)
      description: |
        Emails a link that works once, for 7 days. Inviting the same address again replaces the
        earlier link. Someone removed earlier comes back as the same member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                name: { type: string, maxLength: 120 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201": { description: Sent, content: { application/json: { schema: { $ref: "#/components/schemas/Invitation" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: "already_member, or email_taken by another organisation" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/invitations/{id}:
    delete:
      summary: Withdraw an open invitation (team)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Withdrawn }
        "404": { $ref: "#/components/responses/Error" }
  /v1/invitations/accept/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    get:
      summary: Show an invitation from its link (no authentication)
      security: []
      responses:
        "200":
          description: The invitation
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization: { type: string }
                  email: { type: string }
                  name: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
                  invited_by: { type: string }
                  expires_at: { type: string, format: date-time }
        "404": { description: Expired, withdrawn or already used }
    post:
      summary: Accept an invitation and sign in (no authentication)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string }
                password: { type: string, minLength: 10 }
      responses:
        "201":
          description: Joined and signed in
          content: { application/json: { schema: { type: object, properties: { session_token: { type: string } } } } }
        "404": { description: Expired, withdrawn or already used }
        "422": { $ref: "#/components/responses/Error" }
  /v1/webhook-endpoints:
    post:
      summary: Add an endpoint that hears about every claim event
      description: |
        Payahub posts each claim event (claim.created, claim.submission_queued, claim.submission_started,
        claim.attempt_failed, claim.acknowledged, claim.rejected, claim.returned_to_ready,
        claim.validation_failed, claim.reviewed, and ping) to the endpoint as JSON, signed in the
        Standard Webhooks format: headers webhook-id, webhook-timestamp and webhook-signature
        (v1, then base64 HMAC-SHA256 of "id.timestamp.body" with the secret's base64 key). Each event is
        written in the same transaction as the change it reports, so none is lost. Delivery is at least
        once and not ordered: drop repeats by id and order by created_at. A non-2xx answer is retried
        with backoff for about two and a half days. The address must be public https. An API key's
        endpoint hears its own environment; a console session names one (sandbox by default).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: "https://hms.example.com/payahub/events" }
                description: { type: string, maxLength: 200 }
                environment: { enum: [sandbox, live], description: Session only }
      responses:
        "201":
          description: Made. The secret is shown this once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
                  secret: { type: string, example: "whsec_..." }
        "422": { $ref: "#/components/responses/Error" }
    get:
      summary: List webhook endpoints, with how their deliveries are going
      parameters:
        - { name: environment, in: query, schema: { enum: [sandbox, live] }, description: Session only }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/WebhookEndpoint" } } } }
  /v1/webhook-endpoints/{id}:
    delete:
      summary: Remove an endpoint and its undelivered events
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /v1/webhook-endpoints/{id}/ping:
    post:
      summary: Send a ping event to check the endpoint
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "202": { description: Queued }
        "404": { $ref: "#/components/responses/Error" }
  /v1/webhook-endpoints/{id}/deliveries:
    get:
      summary: The endpoint's last 50 deliveries, newest first
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        event_type: { type: string }
                        status: { enum: [pending, delivered, failed] }
                        attempts: { type: integer }
                        last_status: { type: integer }
                        last_error: { type: string }
                        created_at: { type: string, format: date-time }
                        delivered_at: { type: string, format: date-time }
                        payload: { $ref: "#/components/schemas/WebhookEvent" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/diagnoses:
    get:
      summary: Find ICD-10 codes by the start of a code ("B50") or by words ("falciparum malaria")
      description: |
        Claims' diagnoses with system `icd-10` (or `icd10`) are checked against this list: a code not shaped
        like ICD-10 stops the claim (`diagnosis_invalid`); one whose category is not in ICD-10 is a warning
        (`diagnosis_unknown`). A listed code with no `display` gets its title.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: B50.9 }
                        title: { type: string }
                        billable: { type: boolean }
  /v1/price-list:
    get:
      security: [{ apiKey: [] }, { session: [] }]
      summary: The organisation's price list, with each code's confirmed standard item or a suggested one
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Price" } }
                  mapped: { type: integer }
    put:
      security: [{ apiKey: [] }, { session: [] }]
      summary: Add or update prices; codes not sent are left as they are
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                prices:
                  type: array
                  maxItems: 50000
                  items:
                    type: object
                    required: [local_code, name, unit_price]
                    properties:
                      local_code: { type: string, maxLength: 64 }
                      name: { type: string, maxLength: 300 }
                      kind: { enum: [service, lab, imaging, procedure, medication, consumable] }
                      unit_price: { type: integer, minimum: 0, description: Minor units }
                      currency: { type: string, default: GHS }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/PriceChanges" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/price-list/import:
    post:
      security: [{ apiKey: [] }, { session: [] }]
      summary: Import a CSV or Excel price list
      description: |
        The header row (within the first 10 rows) needs a code, a name and a price column; a category
        column sets the kind. `merge` adds and updates; `replace` also removes codes the file does not
        have. Unreadable rows are skipped and listed. With `dry_run` nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: byte, description: The .csv or .xlsx file, base64 }
                mode: { enum: [merge, replace], default: merge }
                currency: { type: string, default: GHS }
                dry_run: { type: boolean }
      responses:
        "200":
          description: Read (and saved unless dry_run)
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows: { type: integer }
                  skipped: { type: array, items: { type: object, properties: { line: { type: integer }, reason: { type: string } } } }
                  dry_run: { type: boolean }
                  changes: { $ref: "#/components/schemas/PriceChanges" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/price-list/{code}:
    delete:
      security: [{ apiKey: [] }, { session: [] }]
      summary: Remove a price
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /v1/payment-providers:
    get:
      security: [{ apiKey: [] }, { session: [] }]
      summary: Payment providers configured for funding wallets and paying withdrawals
      responses:
        "200": { description: Providers, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/PaymentProvider" } } } } } } }
  /v1/payment-providers/{id}/banks:
    get:
      security: [{ apiKey: [] }, { session: [] }]
      summary: Banks and mobile networks a provider pays out to
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: currency, in: query, schema: { type: string, default: GHS } }
      responses:
        "200": { description: Banks, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { type: object, properties: { code: { type: string }, name: { type: string }, type: { enum: [bank, mobile_money] } } } } } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/wallet:
    get:
      security: [{ apiKey: [] }, { session: [] }]
      summary: The organisation's wallet
      description: |
        `available` is the balance less what live claims in flight will cost once acknowledged. On a
        wallet plan a live claim is refused (402 `wallet_empty`) when `available` does not cover one more.
      responses:
        "200": { description: Wallet, content: { application/json: { schema: { $ref: "#/components/schemas/Wallet" } } } }
  /v1/wallet/transactions:
    get:
      security: [{ apiKey: [] }, { session: [] }]
      summary: The wallet's statement, newest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: before, in: query, description: next_before from the previous page, schema: { type: string } }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_before: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        seq: { type: integer }
                        transaction_id: { type: string }
                        kind: { enum: [funding, charge, fee, withdrawal, withdrawal_returned, adjustment] }
                        memo: { type: string }
                        amount: { type: integer, description: Minor units; positive adds to the wallet }
                        balance_after: { type: integer }
                        reference: { type: string, description: The claim, funding or withdrawal it is for }
                        created_at: { type: string, format: date-time }
  /v1/wallet/fundings:
    post:
      security: [{ apiKey: [] }, { session: [] }]
      summary: Start a checkout that funds the wallet
      description: |
        Returns a `checkout_url` at the provider. The wallet is credited only when the provider confirms
        the payment (on `GET /v1/wallet/fundings/{id}`, the provider's webhook, or the periodic check),
        exactly once. Honours `Idempotency-Key`.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, provider]
              properties:
                amount: { type: integer, minimum: 100, maximum: 10000000, description: Minor units of GHS }
                provider: { type: string }
                callback_url: { type: string, format: uri, description: Where the provider sends the browser afterwards }
      responses:
        "201": { description: Checkout started, content: { application/json: { schema: { $ref: "#/components/schemas/Funding" } } } }
        "200": { description: A repeat of an earlier request with the same Idempotency-Key, content: { application/json: { schema: { $ref: "#/components/schemas/Funding" } } } }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    get:
      security: [{ apiKey: [] }, { session: [] }]
      summary: Recent fundings
      responses:
        "200": { description: Fundings, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Funding" } } } } } } }
  /v1/wallet/fundings/{id}:
    get:
      security: [{ apiKey: [] }, { session: [] }]
      summary: A funding, confirmed with the provider first while it is pending
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Funding, content: { application/json: { schema: { $ref: "#/components/schemas/Funding" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/wallet/payout-accounts:
    get:
      security: [{ apiKey: [] }, { session: [] }]
      summary: Where withdrawals go
      responses:
        "200": { description: Accounts, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/PayoutAccount" } } } } } } }
    post:
      security: [{ session: [] }]
      summary: Add a bank or mobile money account for withdrawals (console session only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, type, name, bank_code, account_number]
              properties:
                provider: { type: string }
                type: { enum: [bank, mobile_money] }
                name: { type: string }
                bank_code: { type: string }
                account_number: { type: string }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/PayoutAccount" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/wallet/payout-accounts/{id}:
    delete:
      security: [{ session: [] }]
      summary: Remove a payout account
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /v1/wallet/withdrawals:
    get:
      security: [{ apiKey: [] }, { session: [] }]
      summary: Recent withdrawals
      responses:
        "200": { description: Withdrawals, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Withdrawal" } } } } } } }
    post:
      security: [{ session: [] }]
      summary: Ask to withdraw from the wallet (console session only)
      description: |
        The amount is held in the wallet at once and paid after a Payahub operator approves it; a
        rejected or failed payout returns it. Money held for live claims in flight cannot be withdrawn.
        Honours `Idempotency-Key`.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, payout_account_id]
              properties:
                amount: { type: integer, minimum: 100 }
                payout_account_id: { type: string }
                reason: { type: string }
      responses:
        "201": { description: Requested, content: { application/json: { schema: { $ref: "#/components/schemas/Withdrawal" } } } }
        "200": { description: A repeat with the same Idempotency-Key, content: { application/json: { schema: { $ref: "#/components/schemas/Withdrawal" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/webhooks/payments/{provider}:
    post:
      summary: A payment provider's webhook
      description: |
        Signature-checked per provider (Paystack: `x-paystack-signature`, HMAC-SHA512 of the body).
        A notice only prompts a check with the provider; money moves on the provider's own record.
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Taken }
        "401": { $ref: "#/components/responses/Error" }
  /v1/operator/withdrawals:
    get:
      security: [{ session: [] }]
      summary: Withdrawals across organisations (operators only)
      parameters: [{ name: status, in: query, description: Comma-separated statuses, schema: { type: string } }]
      responses:
        "200": { description: Withdrawals, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Withdrawal" } } } } } } }
  /v1/operator/withdrawals/{id}/approve:
    post:
      security: [{ session: [] }]
      summary: Approve a requested withdrawal; its payout is queued in the same transaction
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Approved, content: { application/json: { schema: { $ref: "#/components/schemas/Withdrawal" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/operator/withdrawals/{id}/reject:
    post:
      security: [{ session: [] }]
      summary: Reject a requested withdrawal and return its amount to the wallet
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses:
        "200": { description: Rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Withdrawal" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/operator/wallets/{org}/adjustments:
    post:
      security: [{ session: [] }]
      summary: Credit (positive) or debit an organisation's wallet with a reason (operators only)
      parameters:
        - { name: org, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amount, memo], properties: { amount: { type: integer }, memo: { type: string } } } } } }
      responses:
        "201": { description: Posted, content: { application/json: { schema: { $ref: "#/components/schemas/Wallet" } } } }
        "200": { description: A repeat; nothing posted, content: { application/json: { schema: { $ref: "#/components/schemas/Wallet" } } } }
  /v1/operator/ai-usage:
    get:
      security: [{ session: [] }]
      summary: Model calls in the last 30 days per task and model, with failures, tokens and average time (operators only)
      responses:
        "200": { description: Usage }
        "403": { $ref: "#/components/responses/Error" }
  /v1/operator/ai-providers:
    get:
      security: [{ session: [] }]
      summary: Model providers, the tasks they serve and the default Claude model (operators only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AIProvider" } }
                  tasks: { type: array, items: { type: string, enum: [document_intake, code_matching] } }
                  default_models: { type: object, additionalProperties: { type: string } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/operator/ai-providers/{id}:
    put:
      security: [{ session: [] }]
      summary: Create or change a model provider (operators only)
      description: |
        The key is write-only: it is sealed on save and never returned. Leave api_key empty to keep
        the saved one. A change clears the last check. Each task tries its enabled providers by
        ascending priority and moves to the next on an outage or a refusal.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_-]{1,39}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name, model]
              properties:
                kind: { type: string, enum: [anthropic, openai, openai_compatible] }
                name: { type: string }
                base_url: { type: string, description: "Required for openai_compatible; https, or http on localhost" }
                model: { type: string, example: claude-opus-5-5 }
                effort: { type: string, enum: [low, medium, high, xhigh, max], description: Claude only; default high }
                json_mode: { type: string, enum: [schema, object, none], description: OpenAI and compatible only; default schema }
                tasks: { type: array, items: { type: string, enum: [document_intake, code_matching] } }
                priority: { type: integer, minimum: 0, maximum: 1000 }
                enabled: { type: boolean, default: true }
                api_key: { type: string, writeOnly: true, description: Required for anthropic and openai on create }
      responses:
        "200": { description: Changed, content: { application/json: { schema: { $ref: "#/components/schemas/AIProvider" } } } }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AIProvider" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      security: [{ session: [] }]
      summary: Remove a model provider and its sealed key (operators only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /v1/operator/ai-providers/{id}/check:
    post:
      security: [{ session: [] }]
      summary: Ask the provider one small structured question and record whether it answered (operators only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The provider with check_ok and check_message set, content: { application/json: { schema: { $ref: "#/components/schemas/AIProvider" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/operator/ledger:
    get:
      security: [{ session: [] }]
      summary: Platform account balances, what wallets hold, and whether the ledger balances (operators only)
      responses:
        "200": { description: Ledger }
  /v1/operator/payers:
    get:
      security: [{ session: [] }]
      summary: Every catalogue payer, withdrawn ones included, with its settings and code coverage (operators only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/OperatorPayer" } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/operator/payers/import:
    post:
      security: [{ session: [] }]
      summary: Import payers from an export of Serenity's payers (operators only)
      description: |
        Columns: name, platform, external_reference_id, country, is_active (the query is in
        docs/serenity-payers.md). Each row is planned as add, fill (a missing setting), same, conflict
        or skip; settings already in the catalogue are never overwritten. With `dry_run` nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: byte, description: The .csv or .xlsx file, base64 }
                dry_run: { type: boolean }
      responses:
        "200":
          description: The plan for each row, and how many payers were saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  dry_run: { type: boolean }
                  saved: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        line: { type: integer }
                        id: { type: string }
                        name: { type: string }
                        connector: { type: string }
                        action: { enum: [add, fill, same, conflict, skip] }
                        fields: { type: object, additionalProperties: { type: string } }
                        reason: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/operator/payers/{id}:
    put:
      security: [{ session: [] }]
      summary: Add a payer to the shared catalogue or change one (operators only)
      description: |
        `fields` must be settings the chosen connector asks of each payer. Every organisation
        sees the change within a few seconds. A withdrawn payer takes no new claims.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9_]{1,39}$" } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, country, connector]
              properties:
                name: { type: string }
                country: { type: string, minLength: 2, maxLength: 2 }
                connector: { type: string }
                fields: { type: object, additionalProperties: { type: string } }
                notes: { type: string }
                inactive: { type: boolean }
      responses:
        "200": { description: Changed, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorPayer" } } } }
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/OperatorPayer" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/operator/payers/{id}/codes:
    get:
      security: [{ session: [] }]
      summary: Every standard item with the payer's code, and matches from the payer's list for items without one
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: query, schema: { enum: [service, lab, imaging, procedure, medication, consumable] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        item: { $ref: "#/components/schemas/Item" }
                        code: { type: object, nullable: true, properties: { code: { type: string }, description: { type: string } } }
                        in_list: { type: boolean, description: Absent when the payer has no list loaded }
                        generated: { type: boolean }
                        suggestions: { type: array, items: { $ref: "#/components/schemas/CodeSuggestion" } }
                  coverage: { type: object, additionalProperties: { type: object, properties: { coded: { type: integer }, total: { type: integer } } } }
                  list_size: { type: integer }
    put:
      security: [{ session: [] }]
      summary: Set or remove the payer's codes for standard items; an empty code removes it
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                changes:
                  type: array
                  items: { type: object, required: [item_id, code], properties: { item_id: { type: string }, code: { type: string, maxLength: 64 }, description: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/CodesApplied" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/operator/payers/{id}/codes/accept:
    post:
      security: [{ session: [] }]
      summary: Take the best match from the payer's list for every item without a code, where it is sure enough
      description: A match is taken when its confidence is at least `min_confidence` (0.9 by default) and 0.1 ahead of the next.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { min_confidence: { type: number, minimum: 0.5, maximum: 1 } } }
      responses:
        "200": { $ref: "#/components/responses/CodesApplied" }
  /v1/operator/payers/{id}/list:
    put:
      security: [{ session: [] }]
      summary: Replace the payer's own code list from CSV (header row with code and name; group and price optional)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [csv], properties: { csv: { type: string, maxLength: 16777216 } } }
      responses:
        "200":
          description: Loaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: integer }
                  skipped: { type: array, items: { type: object, properties: { line: { type: integer }, reason: { type: string } } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/operator/payers/{id}/changes:
    get:
      security: [{ session: [] }]
      summary: The latest 50 changes to a payer, newest first
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { enum: [seed, payer_created, payer_updated, codes_changed, list_loaded] }
                        detail: { type: object }
                        changed_by: { type: string }
                        changed_at: { type: string, format: date-time }
  /v1/leads:
    post:
      security: []
      summary: Send an enquiry from the public site
      description: |
        `contact` asks to be called (name, email, phone). `platform` is an insurer or claims platform
        that is not listed (organization, email, phone). `payer` asks us to add a payer (payer_name,
        email, phone; monthly_claims and payer_contact help us prioritise). `specs` asks for the
        interface (email; phone optional). Honours `Idempotency-Key`: a repeat returns the first lead with 200.
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, email]
              properties:
                kind: { type: string, enum: [contact, platform, payer, specs] }
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string, description: "7 to 15 digits; spaces, dashes and a leading + are allowed" }
                organization: { type: string }
                payer_name: { type: string }
                monthly_claims: { type: integer, minimum: 0, description: Claims a month the clinic sends this payer }
                payer_contact: { type: string, description: Who to talk to at the payer }
                message: { type: string }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  kind: { type: string }
                  created_at: { type: string, format: date-time }
        "200": { description: A replay of an earlier request with the same Idempotency-Key }
        "422": { $ref: "#/components/responses/Error" }
  /v1/openapi.yaml:
    get:
      security: []
      summary: This specification, for anyone building against Payahub
      responses:
        "200": { description: OpenAPI 3.1 YAML, content: { application/yaml: {} } }
  /v1/operator/leads:
    get:
      security: [{ session: [] }]
      summary: Enquiries from the public site, newest first (operators only)
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [contact, platform, payer, specs] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        kind: { type: string }
                        name: { type: string }
                        email: { type: string }
                        phone: { type: string }
                        organization: { type: string }
                        payer_name: { type: string }
                        monthly_claims: { type: [integer, "null"] }
                        payer_contact: { type: string }
                        message: { type: string }
                        created_at: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    apiKey: { type: http, scheme: bearer, description: "sk_sandbox_… or sk_live_…" }
    session: { type: http, scheme: bearer, description: "ses_… from signup or sign-in" }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string } }
    ClaimID: { name: id, in: path, required: true, schema: { type: string } }
    Wait: { name: wait, in: query, schema: { type: integer, minimum: 0, maximum: 60 }, description: Seconds to wait for the payer's answer }
    Prefer: { name: Prefer, in: header, schema: { type: string, example: "wait=10" }, description: "RFC 7240 wait preference; the same as ?wait" }
  responses:
    StillWaiting:
      description: Sent, and the payer has not answered yet. Poll `Location` or wait for the webhook.
      headers: { Location: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Settled" } } }
    Wallet:
      type: object
      properties:
        currency: { type: string }
        balance: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        pending_withdrawals: { type: integer }
        plan: { type: string }
        price: { type: object, properties: { monthly_fee: { type: integer }, per_claim: { type: integer }, included: { type: integer } } }
        charged_this_month: { type: integer }
        can_send_live: { type: boolean }
    Funding:
      type: object
      properties:
        id: { type: string }
        provider: { type: string }
        amount: { type: integer }
        currency: { type: string }
        status: { enum: [pending, succeeded, failed, abandoned] }
        paid_amount: { type: integer }
        fee: { type: integer }
        provider_reference: { type: string }
        checkout_url: { type: string }
        message: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    PaymentProvider:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        currencies: { type: array, items: { type: string } }
        channels: { type: array, items: { type: string } }
        payouts: { type: boolean }
        sandbox: { type: boolean }
    PayoutAccount:
      type: object
      properties:
        id: { type: string }
        provider: { type: string }
        type: { enum: [bank, mobile_money] }
        name: { type: string }
        bank_code: { type: string }
        bank_name: { type: string }
        account_number: { type: string }
        currency: { type: string }
    AIProvider:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [anthropic, openai, openai_compatible] }
        name: { type: string }
        base_url: { type: string }
        model: { type: string }
        effort: { type: string }
        json_mode: { type: string }
        tasks: { type: array, items: { type: string } }
        priority: { type: integer }
        enabled: { type: boolean }
        has_key: { type: boolean }
        key_hint: { type: string, description: Last four characters of the saved key }
        checked_at: { type: string, format: date-time }
        check_ok: { type: boolean }
        check_message: { type: string }
        updated_at: { type: string, format: date-time }
    Withdrawal:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        organization_name: { type: string }
        payout_account_id: { type: string }
        destination: { type: string }
        provider: { type: string }
        amount: { type: integer }
        currency: { type: string }
        status: { enum: [requested, approved, paying, paid, failed, rejected] }
        reason: { type: string }
        message: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    CodesApplied:
      description: Applied
      content:
        application/json:
          schema:
            type: object
            properties:
              applied: { type: integer }
              warnings: { type: array, items: { type: string }, description: Codes not in the payer's list }
              coded_items: { type: integer }
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  details: {}
  schemas:
    Code:
      type: object
      required: [system, value]
      properties:
        system: { type: string, examples: ["icd-10", "payer:claimiq", "local"] }
        value: { type: string }
        display: { type: string }
    Evidence:
      type: object
      required: [origin]
      properties:
        origin: { enum: [submitted, ai_extracted, ai_mapped, rule_derived, human_confirmed] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        model_version: { type: string }
        prompt_version: { type: string }
        prompt_hash: { type: string }
        assertion: { type: string }
        confirmed_by: { type: string }
    CodeMapping:
      type: object
      required: [source]
      properties:
        source: { $ref: "#/components/schemas/Code" }
        target: { $ref: "#/components/schemas/Code" }
        evidence: { $ref: "#/components/schemas/Evidence" }
    ClaimInput:
      type: object
      additionalProperties: false
      required: [payer_id, member, provider, encounter]
      properties:
        payer_id: { type: string }
        currency: { type: string, default: GHS }
        authorization_code: { type: string }
        member:
          type: object
          required: [member_number]
          properties:
            member_number: { type: string }
            policy_number: { type: string }
            first_name: { type: string }
            last_name: { type: string }
            birth_date: { type: string, format: date }
            gender: { type: string }
            phone: { type: string }
        provider:
          type: object
          required: [name]
          properties:
            name: { type: string }
            facility_code: { type: string }
            practitioner_id: { type: string }
        encounter:
          type: object
          required: [start_date]
          properties:
            type: { enum: [outpatient, inpatient], default: outpatient }
            reference: { type: string }
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
            admission_date: { type: string, format: date }
            discharge_date: { type: string, format: date }
        lines:
          type: array
          items:
            type: object
            description: |
              A line with the organisation's own code that is on its price list may leave out
              `description` and `unit_price`: both come from the list (an explicit 0 stays 0).
            properties:
              id: { type: string }
              description: { type: string, description: Required unless the code is on the price list }
              category: { enum: [service, procedure, drug, consumable] }
              code:
                $ref: "#/components/schemas/Code"
                description: |
                  The organisation's own code (mapped with PUT /v1/item-mappings) or a standard item
                  as {"system": "payahub", "value": "MED-0001"}.
              item: { type: string, description: The standard item the line resolved to (set by Payahub) }
              mapping:
                $ref: "#/components/schemas/CodeMapping"
                description: The payer's code. Filled in from the standard item; send it only to override.
              quantity: { type: integer, minimum: 1, default: 1 }
              unit_price: { type: integer, minimum: 0, description: Minor units. Left out, the price list's price is used }
              price_from: { enum: [price_list], description: Set by Payahub when the price came from the price list }
              service_date: { type: string, format: date }
              prescription:
                type: object
                description: How a drug was prescribed. Some payers refuse a medicine without it.
                properties:
                  dose: { type: string, example: "1 tablet" }
                  frequency: { type: string, example: "3 times daily" }
                  duration: { type: string, example: "5 days" }
                  instructions: { type: string }
        diagnoses:
          type: array
          items:
            type: object
            required: [code]
            properties:
              code: { $ref: "#/components/schemas/Code" }
              role: { enum: [primary, secondary], default: secondary }
              description: { type: string, description: The diagnosis in words }
              status: { enum: [provisional, confirmed], description: Payers that ask are told provisional unless confirmed }
              mapping: { $ref: "#/components/schemas/CodeMapping" }
    Claim:
      allOf:
        - $ref: "#/components/schemas/ClaimInput"
        - type: object
          properties:
            id: { type: string }
            organization_id: { type: string }
            environment: { enum: [sandbox, live] }
            state:
              enum: [draft, mapped, validated, needs_review, ready, submitted, acknowledged, approved, rejected, paid, withdrawn]
            payer_claim_number: { type: string }
            total: { type: integer, description: Minor units }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    Role:
      type: string
      enum: [owner, admin, claims, finance, developer, viewer]
    Member:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
    Invitation:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invited_by: { type: string, description: The inviter's name }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    WebhookEndpoint:
      type: object
      properties:
        id: { type: string }
        environment: { enum: [sandbox, live] }
        url: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        delivered_24h: { type: integer }
        failing: { type: integer, description: Events still being retried after a failed attempt }
        last_error: { type: string }
        last_delivered_at: { type: string, format: date-time }
    WebhookEvent:
      type: object
      properties:
        id: { type: string, example: evt_1842 }
        type: { type: string, example: claim.acknowledged }
        created_at: { type: string, format: date-time }
        data:
          type: object
          properties:
            claim_id: { type: string }
            state: { type: string }
            previous_state: { type: string }
            payer_claim_number: { type: string }
            detail: { type: object, description: "The event's detail: an error, the checks, the plan" }
    Settled:
      type: object
      properties:
        claim: { $ref: "#/components/schemas/Claim" }
        issues: { type: array, items: { $ref: "#/components/schemas/Issue" } }
        outcome:
          nullable: true
          description: Null while the payer has not answered
          type: object
          properties:
            state: { type: string, description: "acknowledged, rejected, ready (a person must fix something), or another claim state" }
            final: { type: boolean, description: True when the payer has given its answer }
            payer_claim_number: { type: string }
            message: { type: string }
            error:
              type: object
              properties: { code: { type: string }, message: { type: string }, payer_message: { type: string } }
    Validation:
      type: object
      properties:
        state: { type: string }
        submission_plan:
          type: object
          properties:
            line_mode: { enum: [realtime, bulk] }
            timing: { enum: [early, deferred] }
        issues: { type: array, items: { $ref: "#/components/schemas/Issue" } }
    Issue:
      type: object
      properties:
        code: { type: string }
        severity: { enum: [error, warning, review] }
        field: { type: string }
        message: { type: string }
    Payer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        kind: { enum: [standalone, integrated], description: Integrated payers are reached through a platform }
        connector:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            kind: { enum: [platform, direct] }
            status: { enum: [available, porting] }
        status: { enum: [available, connecting] }
        member_otp_required: { type: boolean }
        capabilities: { type: array, items: { type: string } }
        coded_items: { type: integer, description: Standard items this payer has a code for }
        notes: { type: string }
    CredentialField:
      type: object
      properties: { name: { type: string }, label: { type: string }, secret: { type: boolean }, required: { type: boolean } }
    Connector:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { enum: [platform, direct] }
        country: { type: string }
        channel: { enum: [api, portal, email] }
        capabilities: { type: array, items: { type: string } }
        member_otp_required: { type: boolean }
        credentials: { type: array, items: { $ref: "#/components/schemas/CredentialField" }, description: The organisation's account fields }
        payer_fields: { type: array, items: { $ref: "#/components/schemas/CredentialField" }, description: Set per payer in the catalogue }
        status: { enum: [available, porting] }
    ConnectorAccount:
      type: object
      properties:
        connector: { type: string }
        environment: { enum: [sandbox, live] }
        credential_fields: { type: array, items: { type: string }, description: Names of the fields that are set }
        checked_at: { type: [string, "null"], format: date-time }
        check_ok: { type: [boolean, "null"] }
        check_message: { type: string }
        updated_at: { type: string, format: date-time }
    ItemKind: { enum: [service, lab, imaging, procedure, medication, consumable] }
    Price:
      type: object
      properties:
        local_code: { type: string }
        name: { type: string }
        kind: { type: string }
        unit_price: { type: integer, description: Minor units }
        currency: { type: string }
        item_id: { type: string, description: The confirmed standard item }
        suggestion: { type: object, description: A standard item that may match, when none is confirmed }
        updated_at: { type: string, format: date-time }
    PriceChanges:
      type: object
      properties:
        added: { type: integer }
        changed: { type: integer }
        unchanged: { type: integer }
        removed: { type: integer }
    OperatorPayer:
      allOf:
        - { $ref: "#/components/schemas/Payer" }
        - type: object
          properties:
            fields: { type: object, additionalProperties: { type: string } }
            inactive: { type: boolean }
            missing_fields: { type: array, items: { type: string } }
            list_size: { type: integer }
            total_items: { type: integer }
    CodeSuggestion:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        group: { type: string }
        price: { type: integer, description: Minor units }
        confidence: { type: number }
    Item:
      type: object
      properties:
        id: { type: string, examples: [MED-0001] }
        kind: { $ref: "#/components/schemas/ItemKind" }
        name: { type: string }
        generic: { type: string }
        strength: { type: string }
        form: { type: string }
        synonyms: { type: array, items: { type: string } }
        codes: { type: array, items: { $ref: "#/components/schemas/Code" }, description: Other standards, such as ATC }
    ItemMapping:
      type: object
      properties:
        local_code: { type: string }
        local_name: { type: string }
        item_id: { type: string }
        confirmed_by: { type: string, description: The user who confirmed it, or api:<environment> }
        updated_at: { type: string, format: date-time }
    Plan: { enum: [trial, flat, flat_volume, volume, enterprise, enterprise_requested] }
    Method: { enum: [rest, batch, documents, web_form] }
    Profile:
      type: object
      required: [billing_system, claims_leave_by, monthly_claims, has_developers]
      properties:
        billing_system: { enum: [emr, practice_software, spreadsheets, paper] }
        claims_leave_by: { enum: [portal, email, paper, integration] }
        monthly_claims: { type: integer, minimum: 0 }
        has_developers: { type: boolean }
        payers: { type: array, items: { type: string } }
        method: { $ref: "#/components/schemas/Method" }
    Recommendation:
      type: object
      properties:
        method: { $ref: "#/components/schemas/Method" }
        reason: { type: string }
        available: { type: boolean, description: Whether the method can be used today; only rest is, for now }
        fallback: { $ref: "#/components/schemas/Method" }
    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        plan: { $ref: "#/components/schemas/Plan" }
        trial_ends_at: { type: [string, "null"], format: date-time }
        profile: { oneOf: [{ $ref: "#/components/schemas/Profile" }, { type: "null" }] }
        user: { type: object, properties: { id: { type: string }, name: { type: string }, email: { type: string } } }
        created_at: { type: string, format: date-time }
    Usage:
      type: object
      properties:
        month: { type: string, description: YYYY-MM }
        billable_live: { type: integer, description: Live claims an insurer acknowledged this month }
        sandbox_claims: { type: integer }
        live_claims: { type: integer }
        trial_live_limit: { type: integer }
    APIKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        environment: { enum: [sandbox, live] }
        prefix: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        key: { type: string, description: Only in the create response }
    PayerSetting:
      type: object
      properties:
        payer_id: { type: string }
        environment: { enum: [sandbox, live] }
        enabled: { type: boolean }
        account: { enum: [have, need], description: Whether the organisation has an account on the payer's platform }
        updated_at: { type: string, format: date-time }
    ClaimSummary:
      type: object
      properties:
        id: { type: string }
        environment: { enum: [sandbox, live] }
        payer_id: { type: string }
        state: { type: string }
        payer_claim_number: { type: string }
        member_number: { type: string }
        currency: { type: string }
        total: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
